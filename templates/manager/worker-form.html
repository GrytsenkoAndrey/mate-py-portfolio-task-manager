{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
    <main class="tm-content">
      <div class="page-header">
        <div>
          <div class="breadcrumb">
            <a href="workers.html">Сотрудники</a> <span class="text-muted mx-1">/</span>
            <a href="{% url "manager:worker-detail" pk=user.id %}">{{ user.first_name }} {{ user.last_name }}</a> <span class="text-muted mx-1">/</span>
            <span class="current">Профиль сотрудника</span>
          </div>
          <h1>Профиль сотрудника</h1>
          <p class="text-muted mb-0 mt-1">Редактирование данных учётной записи</p>
        </div>
        <div class="d-flex gap-2"></div>
      </div>
      <form class="needs-validation" novalidate style="max-width:720px" method="post">
        {% csrf_token %}
        {{ form|crispy }}

        <div class="d-flex justify-content-between gap-2 mt-4 pt-3 border-top">
          <button type="button" class="btn btn-ghost text-danger" data-bs-toggle="modal" data-bs-target="#confirmDelete" data-name="{{ user.first_name }} {{ user.last_name }}">Удалить сотрудника</button>
          <div class="d-flex gap-2">
            <a href="{% url "manager:worker-detail" pk=user.id %}" class="btn btn-outline-secondary">Отмена</a>
            <button type="submit" class="btn btn-dark">Сохранить</button>
          </div>
        </div>
      </form>
    </main>
{% endblock %}
