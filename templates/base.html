<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Обзор · TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  {% load static %}
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body data-section="dashboard" data-today="2026-11-21">

   {% include "includes/aside.html" %}

   <div class="tm-main">
    <header class="tm-topbar d-flex align-items-center gap-3 px-3 px-sm-4">
      <button class="btn btn-ghost d-lg-none px-2" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="Меню"><i class="bi bi-list fs-5"></i></button>
      <div class="input-icon flex-grow-1" style="max-width:360px">
        <i class="bi bi-search"></i>
        <input type="search" class="form-control form-control-sm border-0 bg-light" placeholder="Поиск…  /" data-search aria-label="Поиск">
      </div>
      <a href="task-form.html" class="btn btn-dark btn-sm ms-auto"><i class="bi bi-plus-lg me-1"></i><span class="d-none d-sm-inline">Новая задача</span></a>
    </header>

    {% block content %}{% endblock %}

  </div>

  <div class="modal fade" id="confirmDelete" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-body p-4">
          <h2 class="mb-2">Удалить?</h2>
          <p class="text-muted mb-4">«<span data-delete-name></span>» будет удалено без возможности восстановления.</p>
          <div class="d-flex gap-2 justify-content-end">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
            <button type="button" class="btn btn-danger" data-delete-confirm>Удалить</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
