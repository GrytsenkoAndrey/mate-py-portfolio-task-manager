{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<main class="tm-content">
  <div class="page-header">
    <div>
      <h1>{% if object %}Редактировать задачу{% else %}Новая задача{% endif %}</h1>
      <p class="text-muted mb-0 mt-1">Заполните данные задачи</p>
    </div>
  </div>
  <form method="post" style="max-width:900px">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
      <a href="{% url 'manager:tasks' %}" class="btn btn-outline-secondary">Отмена</a>
      <button type="submit" class="btn btn-dark">Сохранить задачу</button>
    </div>
  </form>
</main>
{% endblock %}
