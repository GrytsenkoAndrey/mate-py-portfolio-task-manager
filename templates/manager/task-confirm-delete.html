{% extends "base.html" %}

{% block content %}
<main class="tm-content">
  <div class="page-header">
    <div>
      <h1>Удалить задачу?</h1>
      <p class="text-muted mb-0 mt-1">Проверьте действие перед подтверждением</p>
    </div>
  </div>
  <div class="card" style="max-width:720px">
    <div class="card-body">
      <p>Вы действительно хотите удалить задачу «{{ object.name }}»?</p>
      <p class="text-muted">Задача будет удалена; связанные теги и проекты останутся.</p>
      <form method="post" class="d-flex justify-content-end gap-2">
        {% csrf_token %}
        <a href="{% url 'manager:tasks' %}" class="btn btn-outline-secondary">Отмена</a>
        <button type="submit" class="btn btn-danger">Удалить задачу</button>
      </form>
    </div>
  </div>
</main>
{% endblock %}
